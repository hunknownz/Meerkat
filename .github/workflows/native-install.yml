name: Native installation
on:
  push:
    branches: [main, codex/native-install-20261005]
    paths: ['internal/**', 'scripts/**', 'tests/**', 'go.*', '.mcp.json', '.codex-plugin/**', '.github/workflows/native-install.yml']
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Exercise downloads with Node and Go absent
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-install-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native platform checks
        run: go test ./internal/platform ./internal/localipc ./internal/executor ./internal/store -run TestNative -count=1 -timeout 2m
      - name: Bootstrap contracts
        run: node --test tests/install.test.mjs
      - name: Windows PowerShell installation
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/install.ps1 -Source -NoHost -NoExecutor -NoStart -DataDir "$env:RUNNER_TEMP\meerkat-bootstrap-state" -RuntimeDir "$env:RUNNER_TEMP\meerkat-bootstrap-runtime"
      - name: Windows missing toolchains bootstrap
        if: runner.os == 'Windows' && (github.ref != 'refs/heads/main' || inputs.bootstrap)
        shell: powershell
        run: |
          $gitBin=Split-Path (Get-Command git).Source -Parent
          $env:USERPROFILE=Join-Path $env:RUNNER_TEMP 'meerkat-fresh-home'
          $env:PATH="$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0;$gitBin"
          ./scripts/install.ps1 -Source -NoHost -NoExecutor -NoStart -DataDir "$env:RUNNER_TEMP\meerkat-fresh-state" -RuntimeDir "$env:RUNNER_TEMP\meerkat-fresh-runtime"
      - name: Clean installation and stdio panel resource
        run: node scripts/verify-install.mjs
