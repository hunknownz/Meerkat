<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Meerkat · Agent 状态</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" type="image/svg+xml" href="/meerkat.svg">
</head>
<body>
<main class="monitor">
  <header class="head">
    <h1><img class="brandmark" src="/meerkat.svg" alt="">Meerkat <span class="sub">运行中的 Agent</span></h1>
    <p id="status" class="status" role="status" aria-live="polite">正在连接…</p>
  </header>
  <p id="count" class="count" aria-live="polite">—</p>
  <ul id="agents" class="agents" aria-label="运行中的 Agent"></ul>
  <p id="updated" class="updated"></p>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
